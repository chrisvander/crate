apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backend

secretGenerator:
  - name: server-credentials
    files:
      - firebase.json
  - name: regcred
    type: kubernetes.io/dockerconfigjson
    files:
      - ".dockerconfigjson"

resources:
  - ingress.yml
  - server.yml
