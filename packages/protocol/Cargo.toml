[package]
name = "crate-protocol"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
atrium-api = { version = "=0.25.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
inventory = "0.3"
jacquard-common = { version = "=0.12.2", default-features = false, features = ["std"] }
jacquard-derive = "=0.12.2"
jacquard-lexicon = { version = "=0.12.2", default-features = false }
poem-openapi = "=5.1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
